<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Поиск товара</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .subtitle {
      font-size: 15px;
      opacity: 0.9;
      margin-bottom: 28px;
    }
    .input-group {
      position: relative;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 16px 20px;
      padding-left: 52px;
      font-size: 16px;
      border: none;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      outline: none;
      transition: all 0.3s;
      font-weight: 500;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }
    input:focus {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
    }
    .icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: rgba(255, 255, 255, 0.8);
    }
    .partners-section {
      margin-bottom: 24px;
      text-align: left;
    }
    .partners-header {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .partner-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 200px;
      overflow-y: auto;
      padding: 8px 0;
    }
    .partner-item {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #fff;
    }
    .partner-item input[type="checkbox"] {
      margin-right: 12px;
      flex-shrink: 0;
      accent-color: #ffffff;
      width: 18px;
      height: 18px;
      vertical-align: middle;
    }
    .partner-item label {
      display: inline-block;
      vertical-align: middle;
      font-size: 14px;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
      padding: 0;
      line-height: 1.4;
      min-height: 20px;
    }
    .select-all {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 8px;
      cursor: pointer;
      text-align: left;
    }
    .select-all:hover {
      color: #ffffff;
    }
    .buttons-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    button {
      background: #ffffff;
      color: #2575fc;
      border: none;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      width: 100%;
    }
    button:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.4);
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .loading {
      display: none;
      margin-top: 16px;
      font-size: 14px;
      opacity: 0.9;
    }
    .loading.visible {
      display: block;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .results {
      margin-top: 24px;
      text-align: left;
    }
    .result-card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeIn 0.3s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-card h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 8px;
    }
    .result-card .field {
      font-size: 14px;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.9);
    }
    .result-card .field strong {
      color: #ffffff;
      font-weight: 500;
    }
    .result-card .price {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 8px;
    }
    .result-card.error {
      background: rgba(255, 82, 82, 0.2);
      border-color: rgba(255, 82, 82, 0.4);
    }
    .result-card.error h3 {
      color: #ff5252;
      border-bottom-color: rgba(255, 82, 82, 0.3);
    }
    .result-card.not-found {
      background: rgba(255, 193, 7, 0.2);
      border-color: rgba(255, 193, 7, 0.4);
    }
    .result-card.not-found h3 {
      color: #ffc107;
      border-bottom-color: rgba(255, 193, 7, 0.3);
    }
    .error-message {
      background: rgba(255, 82, 82, 0.2);
      border: 1px solid rgba(255, 82, 82, 0.4);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      text-align: center;
      color: #ff5252;
      font-size: 14px;
    }
    .success-message {
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid rgba(76, 175, 80, 0.4);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      text-align: center;
      color: #4caf50;
      font-size: 14px;
    }
    .no-results {
      text-align: center;
      padding: 20px;
      opacity: 0.8;
      font-size: 14px;
    }
    /* Modal styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: modalFadeIn 0.3s ease-in;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #ffffff;
    }
    .modal-partner-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .modal-partner-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }
    .modal-partner-item:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
    }
    .modal-partner-item input[type="radio"] {
      margin-right: 12px;
      accent-color: #ffffff;
      width: 18px;
      height: 18px;
    }
    .modal-partner-item label {
      font-size: 16px;
      color: #ffffff;
      cursor: pointer;
      flex: 1;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
    }
    .modal-buttons button {
      flex: 1;
    }
    .modal-buttons button.cancel {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }
    .file-upload-area {
      display: none;
      margin-top: 20px;
    }
    .file-upload-area.active {
      display: block;
    }
    .file-input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }
    .file-input-wrapper input[type="file"] {
      display: none;
    }
    .file-input-label {
      display: block;
      padding: 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      color: rgba(255, 255, 255, 0.9);
    }
    .file-input-label:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.6);
    }
    .file-name {
      margin-top: 8px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Поиск товара</h1>
    <p class="subtitle">Введите артикул, чтобы найти нужный товар</p>

    <div class="input-group">
      <span class="icon">📦</span>
      <input type="text" id="article" placeholder="Введите артикул, например: XT902" autofocus />
    </div>

    <div class="partners-section">
      <div class="partners-header">Выберите поставщиков для поиска:</div>
      <div class="partner-list" id="partner-list"></div>
      <div class="select-all" id="select-all">Выбрать всех</div>
    </div>

    <div class="buttons-section">
      <button id="search-btn">Найти товар</button>
      <button id="upload-btn" class="secondary">📁 Загрузить прайс-лист</button>
    </div>

    <div class="loading" id="loading">
      <span class="spinner"></span>
      <span id="loading-text">Идёт поиск...</span>
    </div>

    <div class="results" id="results"></div>
  </div>

  <!-- Modal for uploading price list -->
  <div class="modal-overlay" id="upload-modal">
    <div class="modal">
      <h2>📁 Загрузка прайс-листа</h2>

      <div class="modal-partner-list" id="modal-partner-list">
        <div class="modal-partner-item">
          <input type="radio" name="upload-partner" id="upload-merlion" value="Merlion" checked>
          <label for="upload-merlion">Merlion</label>
        </div>
        <div class="modal-partner-item">
          <input type="radio" name="upload-partner" id="upload-netlab" value="Netlab">
          <label for="upload-netlab">Netlab</label>
        </div>
        <div class="modal-partner-item">
          <input type="radio" name="upload-partner" id="upload-ocs" value="OCS">
          <label for="upload-ocs">OCS</label>
        </div>
        <div class="modal-partner-item">
          <input type="radio" name="upload-partner" id="upload-treolan" value="Treolan">
          <label for="upload-treolan">Treolan</label>
        </div>
      </div>

      <div class="file-upload-area" id="file-upload-area">
        <div class="file-input-wrapper">
          <input type="file" id="file-input" accept=".xlsx,.xls,.csv,.xml,.json">
          <label for="file-input" class="file-input-label">
            <div>📄 Выберите файл</div>
            <div class="file-name" id="file-name"></div>
          </label>
        </div>
      </div>

      <div class="modal-buttons">
        <button class="cancel" id="cancel-upload">Отмена</button>
        <button id="confirm-upload" disabled>Загрузить</button>
      </div>
    </div>
  </div>

  <script>
    // Backend URL - относительный путь для работы через FastAPI
    const BACKEND_URL = '/api/v1';

    const articleInput = document.getElementById('article');
    const searchBtn = document.getElementById('search-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const partnerList = document.getElementById('partner-list');
    const selectAllBtn = document.getElementById('select-all');
    const loadingEl = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const resultsEl = document.getElementById('results');

    // Modal elements
    const uploadModal = document.getElementById('upload-modal');
    const modalPartnerList = document.getElementById('modal-partner-list');
    const fileUploadArea = document.getElementById('file-upload-area');
    const fileInput = document.getElementById('file-input');
    const fileName = document.getElementById('file-name');
    const cancelUploadBtn = document.getElementById('cancel-upload');
    const confirmUploadBtn = document.getElementById('confirm-upload');

    // Список партнёров
    const partners = [
      { name: 'Merlion', key: 'merlion' },
      { name: 'Netlab', key: 'netlab' },
      { name: 'OCS', key: 'osc' },
      { name: '3Logic', key: '3logic' },
      { name: 'Treolan', key: 'treolan' }
    ];

    // Создаём чекбоксы
    const checkboxes = {};
    partners.forEach(partner => {
      const div = document.createElement('div');
      div.className = 'partner-item';

      const id = `partner-${partner.key}`;
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = id;
      checkbox.checked = true;
      checkbox.dataset.key = partner.key;
      checkboxes[partner.key] = checkbox;

      const label = document.createElement('label');
      label.setAttribute('for', id);
      label.textContent = partner.name;

      div.appendChild(checkbox);
      div.appendChild(label);
      partnerList.appendChild(div);
    });

    // Логика "Выбрать всех"
    let isAllSelected = true;
    selectAllBtn.addEventListener('click', () => {
      isAllSelected = !isAllSelected;
      selectAllBtn.textContent = isAllSelected ? 'Выбрать всех' : 'Снять все';
      partners.forEach(p => {
        checkboxes[p.key].checked = isAllSelected;
      });
    });

    function getSelectedPartners() {
      return partners
        .filter(p => checkboxes[p.key].checked)
        .map(p => p.name);
    }

    function formatPrice(price) {
      if (typeof price === 'number') {
        return `${price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} $`;
      }
      return price || 'Не указана';
    }

    function formatQuantity(quantity) {
      if (typeof quantity === 'number') {
        return `${Math.floor(quantity)} шт`;
      }
      return quantity || '0 шт';
    }

    function createResultCard(partner, data, status, error) {
      const card = document.createElement('div');
      card.className = 'result-card';

      if (status === 'error') {
        card.classList.add('error');
        card.innerHTML = `
          <h3>❌ ${partner}</h3>
          <div class="field">${error || 'Ошибка при получении данных'}</div>
        `;
      } else if (status === 'not_implemented') {
        card.classList.add('not-found');
        card.innerHTML = `
          <h3>⚠️ ${partner}</h3>
          <div class="field">Поиск по этому поставщику временно недоступен</div>
        `;
      } else if (!data || Object.keys(data).length === 0) {
        card.classList.add('not-found');
        card.innerHTML = `
          <h3>📦 ${partner}</h3>
          <div class="field">Нет данных для данного артикула</div>
        `;
      } else {
        card.innerHTML = `
          <h3>📦 ${partner}</h3>
          <div class="field"><strong>Наименование:</strong> ${data['Наименование'] || 'Не указано'}</div>
          <div class="field"><strong>Артикул:</strong> <code>${articleInput.value.trim()}</code></div>
          <div class="field"><strong>Количество:</strong> ${formatQuantity(data['Количество'])}</div>
          <div class="field"><strong>Транзит:</strong> ${data['Транзиты'] || 'Нет данных'}</div>
          <div class="field"><strong>Удалённый склад:</strong> ${data['Удаленный склад'] || 'Нет данных'}</div>
          <div class="price">${formatPrice(data['Цена'])}</div>
        `;
      }

      return card;
    }

    async function search() {
      const article = articleInput.value.trim();

      if (!article) {
        alert('Пожалуйста, введите артикул!');
        return;
      }

      const selectedPartners = getSelectedPartners();
      if (selectedPartners.length === 0) {
        alert('Выберите хотя бы одного партнёра для поиска!');
        return;
      }

      // UI: loading state
      searchBtn.disabled = true;
      loadingEl.classList.add('visible');
      loadingText.textContent = 'Идёт поиск...';
      resultsEl.innerHTML = '';

      try {
        const response = await fetch(`${BACKEND_URL}/vendors/search`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            article: article,
            partners: selectedPartners
          })
        });

        if (!response.ok) {
          throw new Error(`Ошибка сервера: ${response.status} ${response.statusText}`);
        }

        const result = await response.json();

        if (result.results && result.results.length > 0) {
          result.results.forEach(item => {
            const card = createResultCard(
              item.partner,
              item.data,
              item.status,
              item.error
            );
            resultsEl.appendChild(card);
          });
        } else {
          resultsEl.innerHTML = '<div class="no-results">Результаты не найдены</div>';
        }

      } catch (error) {
        if (error.name === 'TypeError' && error.message.includes('fetch')) {
          resultsEl.innerHTML = `<div class="error-message">Не удалось подключиться к серверу. Проверьте соединение.</div>`;
        } else {
          resultsEl.innerHTML = `<div class="error-message">Ошибка: ${error.message}</div>`;
        }
      } finally {
        searchBtn.disabled = false;
        loadingEl.classList.remove('visible');
      }
    }

    // Upload modal logic
    uploadBtn.addEventListener('click', () => {
      uploadModal.classList.add('active');
      fileUploadArea.classList.remove('active');
      confirmUploadBtn.disabled = true;
      fileName.textContent = '';
      fileInput.value = '';
    });

    cancelUploadBtn.addEventListener('click', () => {
      uploadModal.classList.remove('active');
    });

    uploadModal.addEventListener('click', (e) => {
      if (e.target === uploadModal) {
        uploadModal.classList.remove('active');
      }
    });

    // Show file upload area when partner is selected
    const radioButtons = document.querySelectorAll('input[name="upload-partner"]');
    radioButtons.forEach(radio => {
      radio.addEventListener('change', () => {
        fileUploadArea.classList.add('active');
      });
    });

    // Handle file selection
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileName.textContent = file.name;
        confirmUploadBtn.disabled = false;
      } else {
        fileName.textContent = '';
        confirmUploadBtn.disabled = true;
      }
    });

    // Handle file upload
    confirmUploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert('Пожалуйста, выберите файл!');
        return;
      }

      const selectedPartner = document.querySelector('input[name="upload-partner"]:checked').value;

      // UI: loading state
      confirmUploadBtn.disabled = true;
      loadingEl.classList.add('visible');
      loadingText.textContent = `Загрузка прайс-листа ${selectedPartner}...`;
      resultsEl.innerHTML = '';

      const formData = new FormData();
      formData.append('file', file);
      formData.append('partner', selectedPartner);

      try {
        const response = await fetch(`${BACKEND_URL}/vendors/upload-pricelist`, {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error(`Ошибка сервера: ${response.status} ${response.statusText}`);
        }

        const result = await response.json();

        resultsEl.innerHTML = `
          <div class="success-message">
            ✅ Прайс-лист ${selectedPartner} успешно загружен!<br>
            Обработано записей: ${result.records_count || 'N/A'}
          </div>
        `;

        setTimeout(() => {
          uploadModal.classList.remove('active');
        }, 2000);

      } catch (error) {
        resultsEl.innerHTML = `<div class="error-message">Ошибка загрузки: ${error.message}</div>`;
        confirmUploadBtn.disabled = false;
      } finally {
        loadingEl.classList.remove('visible');
      }
    });

    searchBtn.addEventListener('click', search);
    articleInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') search();
    });

    articleInput.focus();
  </script>
</body>
</html>
